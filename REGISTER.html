<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCULPTORA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
html {
    scrollbar-color: #D4AF37 #0a0a0a;
}

        .container {
            background-color: black;
            background-image: url("./images/register.jpeg");
            width: 100%;
            height: 150vh;
            background-position: center;
            background-size: 90% 100%;
            background-repeat: no-repeat;

        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding-top: 80px;
        }

        .card h2 {
            color: #E9D5A3;
            letter-spacing: 3px;
            font-size: 45px;
            font-weight: 300;
    text-shadow: 0 0 15px rgba(212, 175, 55, 0.6), 0 2px 10px black;

        }

        .login {
            display: flex;
            gap: 10px;
        }

        .btn {
            font-size: 16px;
            font-weight: bold;
            border: none;
            background-color: #E9D5A3;
            padding: 10px 30px;
            border-radius: 20px;
            cursor: pointer;
        }

        .btn a {
            text-decoration: none;
            color: black;
            font-weight: 300;
            font-family: 'Times New Roman', Times, serif;
        }

        .card h3 {
            color: #E9D5A3;
            font-size: 28px;
            font-weight: 300;
    text-shadow: 0 0 15px rgba(212, 175, 55, 0.6), 0 2px 10px black;

        }

        .card p {
            color: #dfdcbb;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap:15px;
        }

        form label {
            color: #E9D5A3;
            font-weight: 600;
            font-size:14px;
        }

        form input{
            width:400px;
            padding: 12px 14px;
            background: black;
            border: 1px solid rgba(225, 176, 17,0.7);
            border-radius: 6px;
            color: #dfdcbb;
            font-size: 11px;
        }
        form input::placeholder{
            color:#E9D5A3;
        }
        form button {
            width: 200px;
            padding: 13px;
            background: #E9D5A3;
            color: #121212;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Times New Roman', Times, serif;
        }
        .card>a{
            color:#E9D5A3;
        }


         @media (max-width:575.99px){
            .card h2{
                font-size:28px;
            }
        }
        p{
            font-size:12px;
        }
        .section{
            width:350px;
        }
        form input{
            width:300px;
        }
        form button{
            width:300px;
        }

        @media (min-width:576px) and (max-width:767.99px){
            .card h2{
                font-size:24px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h2>SCULPTORA GALLERY</h2>
            <div class="login">
                <button class="btn"><a href="REGISTER.html">Register</a></button>
                <button class="btn"><a href="LOGIN.html">Login</a></button>
            </div>
            <h3>Join The Circle</h3>
            <p>Create your account to access exclusive collections & early viewings.</p>
            <form action="">
                <label for="">Full Name</label>
                <input type="text" placeholder="Enter your full name">
                <label for="">Email</label>
                <input type="email" placeholder="Enter your email address">
                <label for="">Password</label>
                <input type="password" placeholder="Create a Password">
                <button>CREATE ACCOUNT</button>
            </form>
            <p>Already have an account?</p>
            <a href="LOGIN.html">Sign in</a>
        </div>
    </div>
</body>

</html>
